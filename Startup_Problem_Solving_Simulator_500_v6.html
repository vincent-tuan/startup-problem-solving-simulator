function productFit(segment,s=state){
  const p=s.product;let score;
  if(segment==='smb')score=p.feature*.34+p.ux*.34+p.reliability*.16+p.security*.06+p.integrations*.10;
  else if(segment==='mid')score=p.feature*.30+p.ux*.18+p.reliability*.22+p.security*.13+p.integrations*.17;
  else score=p.feature*.22+p.ux*.08+p.reliability*.25+p.security*.22+p.integrations*.16+s.compliance*.07;
  if(segment==='ent'&&s.enterpriseReady)score+=7;if(segment==='smb'&&s.plg)score+=6;
  if(s.bootstrap){
    const b=s.bootstrap,evidence=b.problemEvidence*.18+b.icpClarity*.12+Math.min(8,b.designPartners*2);
    score=score*.70+evidence;
    const readiness=clamp(b.mvpProgress/100,0,1);if(!b.mvpReady)score*=.34+readiness*.66;
    if(!b.launch&&getMRR(s)===0)score*=.88;
    if(segment==='ent'&&b.legalStatus!=='company')score*=.74;
  }
  return clamp(score);
}

function computeValuation(s=state,overrideMetrics=null){
  const m=overrideMetrics||getMetrics(s,true),arr=Math.max(0,m.arr);
  if(s.bootstrap&&arr<100000){
    const b=s.bootstrap,traction=50000+b.problemEvidence*3200+b.icpClarity*1100+b.mvpProgress*1400+b.lettersOfIntent*14000+b.designPartners*7000+getMRR(s)*34+b.audience*90+s.brand*900;
    const risk=DIFFICULTIES[s.meta.difficulty].funding*s.market.fundingIndex*clamp(.70+b.health/260+b.energy/350,.72,1.18);
    return Math.max(s.cash-s.debt.principal,clamp(traction*risk,25000,1800000));
  }
  const safeArr=Math.max(1,arr),monthlyGrowth=clamp(m.growth??0,-.2,.25),annualGrowth=(Math.pow(1+monthlyGrowth,12)-1);
  let multiple=4.2*s.market.fundingIndex*DIFFICULTIES[s.meta.difficulty].funding;
  multiple*=clamp(.72+annualGrowth*.85,.55,2.25);
  multiple*=clamp(.72+(m.nrr??.98)*.32,.82,1.18);
  multiple*=clamp(.75+(m.grossMargin??.7)*.38,.88,1.12);
  const efficiency=(m.rule40??-20);multiple*=clamp(.82+(efficiency+20)/170,.72,1.25);
  multiple*=clamp(.88+s.brand/500+s.execution/650,.90,1.15);
  if(safeArr<500000)multiple*=.72;if(safeArr>10000000)multiple*=1.08;
  return Math.max(s.cash-s.debt.principal,safeArr*clamp(multiple,1.3,28));

function getMetrics(s=state,noValuation=false){

  const reportedBurn=finance?.burn??latest.burn,burnAvg=avg(trailing(s,'burn',3).filter(v=>v>0))||Math.max(1,Number.isFinite(reportedBurn)&&reportedBurn>0?reportedBurn:bootstrapFallback);

  const ebitdaMargin=safeDiv(ebitda,Math.max(1,revenue)),annualGrowth=mrr>0?(Math.pow(Math.max(.5,1+growth),12)-1)*100:0,rule40=annualGrowth+ebitdaMargin*100;
  const nrr=finance?.nrr??latest.nrr??(mrr>0?.985:1),cac=finance?.cac??latest.cac??0,payback=finance?.payback??latest.payback??0,ltvCac=finance?.ltvCac??latest.ltvCac??0;
  const out={mrr,arr,counts,customers,growth,burn,runway,grossMargin,ebitda,revenue,ebitdaMargin,rule40,nrr,nps:s.nps,headcount:totalHeadcount(s),cash:s.cash,founderPct:s.capTable.find(x=>x.type==='founder')?.pct||0,boardConfidence:s.board.confidence,uptime:s.product.uptime,cac,payback,ltvCac,ar:sum(s.receivables.map(x=>x.amount)),debt:s.debt.principal};

  out.valuation=noValuation?0:computeValuation(s,out);return out;
}

function validatePlan(s=state){
  const issues=[];
  if(sum(Object.values(s.plan.productAlloc||{}))!==100)issues.push(`Phân bổ Product cho giai đoạn scale phải bằng 100% (hiện ${sum(Object.values(s.plan.productAlloc||{}))}%).`);
  if(Object.values(s.plan.marketing||{}).some(v=>!Number.isFinite(Number(v))||Number(v)<0))issues.push('Ngân sách marketing không thể âm hoặc không hợp lệ.');
  if(Object.values(s.plan.prices||{}).some(v=>!Number.isFinite(Number(v))||Number(v)<=0))issues.push('Giá bán phải lớn hơn 0.');
  if((s.plan.founderDraw||0)<0)issues.push('Founder draw không thể âm.');
  if(s.bootstrap){
    if(Object.values(s.plan.workHours||{}).some(v=>!Number.isFinite(Number(v))||Number(v)<0))issues.push('Giờ hoạt động phải là số không âm.');
    if(Object.values(s.plan.activityBudget||{}).some(v=>!Number.isFinite(Number(v))||Number(v)<0))issues.push('Ngân sách hoạt động phải là số không âm.');
    const sch=s.plan.schedule||{};if([sch.sleepPerNight,sch.lifeHours,sch.dayJobHours].some(v=>!Number.isFinite(Number(v))||Number(v)<0))issues.push('Sleep, life và day-job hours phải là số không âm.');
  }
  if(s.pendingEvent)issues.push('Phải xử lý sự kiện đang chờ trước khi chạy cycle mới.');
  if(s.fundraising.status==='term_sheet')issues.push('Term sheet đang chờ quyết định.');
  if(s.game.status!=='active')issues.push('Nhiệm kỳ hiện tại đã kết thúc.');
  return issues;
}

  return items.slice(0,5);
}

function selectTriggeredEvent(report,s=state){
  if(s.pendingEvent||s.game.status!=='active')return;
  const d=DIFFICULTIES[s.meta.difficulty];
  let eventChance=(isBootstrapMode(s)?.48:.27)+(s.calendar.elapsed%3===0?.09:0)+(d.variance-1)*.08;
  eventChance*=d.event||1;eventChance=clamp(eventChance,.12,.82);
  if(s.flags?.coverupRisk>.25)eventChance=.82;if(s.flags?.ipRisk>.45)eventChance=Math.max(eventChance,.62);
  if(!chance(eventChance,s))return;
  const recent=recentEventIds(s,5);
  const eligible=EVENTS.filter(e=>e.eligible(s,report)&&(!recent.includes(e.id)||e.id==='coverup_exposed'));
  if(!eligible.length)return;
  const weighted=eligible.map(e=>({e,w:Math.max(.01,e.weight(s,report))}));const total=sum(weighted.map(x=>x.w));let r=rand(s)*total,chosen=weighted[weighted.length-1].e;
  for(const x of weighted){r-=x.w;if(r<=0){chosen=x.e;break;}}
  const context=chosen.context?chosen.context(s,report):{};
  s.pendingEvent={id:chosen.id,context,createdAt:report.label};
}

function resolveEvent(index){
  const pending=state.pendingEvent;if(!pending)return;const def=EVENTS.find(e=>e.id===pending.id);if(!def)return;
  const choice=def.choices[index];if(!choice)return;
  choice.apply(state,pending.context||{});state.eventHistory.push({id:def.id,date:pending.createdAt,choice:choice.title});
  state.logs.unshift({date:pending.createdAt,text:`${def.title} — quyết định: ${choice.title}.`,type:def.category});state.pendingEvent=null;
  saveGame();renderApp();closeModal();
  if(state.game.status!=='active')openEndingModal();else toast('Quyết định đã được ghi nhận.','good');
}

function queueHire(role,count=1,notify=true,s=state){
  if(!ROLE_CONFIG[role]||count<1)return;const cfg=ROLE_CONFIG[role],loaded=rolePayroll(role,s)*1.18;
  if(s.bootstrap&&s.cash<loaded*3&&getMRR(s)<loaded*.45&&!hasExternalInvestors(s)){if(notify)toast(`Full-time hire này cần khoảng ${compactMoney(loaded)}/tháng loaded. Hãy dùng contractor, tạo revenue hoặc raise vốn trước.`,'bad');return;}
  for(let i=0;i<count;i++)s.pendingHires.push({role,remaining:Math.max(.8,cfg.hireMonths*randRange(.82,1.18,s)),agency:chance(.28,s)});
  if(notify){saveGame();renderApp();toast(`Đã mở ${count} vị trí ${cfg.name}.`,'good');}
}
function cancelPendingHire(index){if(!state.pendingHires[index])return;state.pendingHires.splice(index,1);saveGame();renderApp();}
function layoffRole(role,count=1){
  if(!ROLE_CONFIG[role]||state.team[role]<=0)return;if(!confirm(`Cắt ${count} ${ROLE_CONFIG[role].name}? Quyết định có severance, morale và attrition aftershock.`))return;
  count=Math.min(count,state.team[role]);state.team[role]-=count;const cost=ROLE_CONFIG[role].salary*2.2*count;state.pendingCosts=state.pendingCosts||[];state.pendingCosts.push({amount:cost,label:`Severance — ${ROLE_CONFIG[role].name}`});state.people.morale=clamp(state.people.morale-2.4*count);state.people.burnout=clamp(state.people.burnout+1.1*count);state.people.layoffMemory=clamp(state.people.layoffMemory+4+count,0,24);state.board.confidence=clamp(state.board.confidence-1);saveGame();renderApp();toast(`Đã lên chi phí severance ${compactMoney(cost)} cho tháng tới.`,'bad');
}
function executeLayoffPlan(total,s=state){
  const order=['marketer','sdr','ae','ops','product','designer','csm','engineer'];let remaining=total,cost=0;
  for(const role of order){if(remaining<=0)break;const floor=role==='engineer'?4:role==='csm'?1:0;const available=Math.max(0,s.team[role]-floor);const cut=Math.min(available,remaining);if(cut){s.team[role]-=cut;cost+=ROLE_CONFIG[role].salary*2.2*cut;remaining-=cut;}}
  s.pendingCosts=s.pendingCosts||[];s.pendingCosts.push({amount:cost,label:'Severance cho reduction in force'});s.people.layoffMemory=18;s.people.burnout=clamp(s.people.burnout+5);s.execution=clamp(s.execution-4);
}

}

function startFundraise(){
  if(state.fundraising.status!=='none'){toast('Đang có quy trình gọi vốn hoặc term sheet.','bad');return;}
  const early=!!state.bootstrap&&getMetrics(state).arr<100000,multiplier=early?1000:1000000,target=Number(document.getElementById('raiseTarget')?.value||0)*multiplier,min=early?10000:500000;
  if(target<min){toast(`Mục tiêu gọi vốn tối thiểu ${compactMoney(min)}.`,'bad');return;}
  if(early&&fundraisingScore(state)<18){toast('Chưa đủ evidence để investor process có ý nghĩa. Hãy có interviews, LOI hoặc MVP progress trước.','bad');return;}
  state.fundraising={...state.fundraising,status:'preparing',target,months:0,interest:0,termSheet:null};state.pendingCosts=state.pendingCosts||[];state.pendingCosts.push({amount:early?Math.min(2500,target*.015):75000,label:early?'Pitch materials, diligence và legal prep':'Legal, finance và data room cho fundraising'});state.logs.unshift({date:currentDateLabel(state),text:`Bắt đầu quy trình gọi ${compactMoney(target)} vốn cổ phần.`,type:'capital'});saveGame();renderApp();toast('Fundraising đã bắt đầu.','good');
}
function cancelFundraise(){if(!['preparing','market'].includes(state.fundraising.status))return;if(!confirm('Dừng fundraising hiện tại? Tín hiệu với thị trường vốn có thể xấu đi.'))return;state.fundraising.status='none';state.fundraising.target=0;state.fundraising.months=0;state.board.relationship=clamp(state.board.relationship-2);saveGame();renderApp();}
function acceptTermSheet(){
  const t=state.fundraising.termSheet;if(!t)return;
  if(t.optionTopUp>0){const founder=state.capTable.find(x=>x.type==='founder');let pool=state.capTable.find(x=>x.type==='employee');if(!pool){pool={name:'Employee option pool',pct:0,type:'employee'};state.capTable.push(pool);}const transfer=Math.min(t.optionTopUp,Math.max(0,founder.pct-.15));founder.pct-=transfer;pool.pct+=transfer;}
  const keep=t.preMoney/t.postMoney;state.capTable.forEach(x=>x.pct*=keep);state.capTable.push({name:t.investor,pct:t.dilution,type:'investor',round:t.round,preference:t.liquidationPref});

    if(b.legal.risk>72)risks.push({level:'high',title:'Legal unknowns đang chặn launch/scale',text:`Risk ${round(b.legal.risk)}/100; cần issue map theo jurisdiction và vertical.`,tab:'knowledge'});

function buildForecast(s=state){
  const m=getMetrics(s),growths=trailing(s,'growth',4),burns=trailing(s,'burn',4).filter(x=>x>0);const baseGrowth=clamp(avg(growths)||.03,-.08,.16),baseBurn=avg(burns)||m.burn;
  const scenarios=[{name:'Downside',growth:baseGrowth-.035,burn:baseBurn*1.12},{name:'Base',growth:baseGrowth,burn:baseBurn},{name:'Upside',growth:baseGrowth+.028,burn:baseBurn*1.08}];
  return scenarios.map(sc=>{let mrr=m.mrr,cash=s.cash;const rows=[];for(let i=1;i<=6;i++){mrr*=1+sc.growth;cash-=sc.burn*(1+i*.01);rows.push({month:i,mrr,cash});}return {...sc,rows,endMRR:mrr,endCash:cash,runway:safeDiv(cash,sc.burn)};});
}

}
function monteCarloForecast(s=state,runs=500,months=12){
  const m=getMetrics(s),f=financeView(s),historyGrowth=trailing(s,'growth',6).filter(Number.isFinite);
  const baseGrowth=clamp(historyGrowth.length?avg(historyGrowth):m.growth,-.07,.13);
  const diff=DIFFICULTIES[s.meta.difficulty],growthVol=(s.meta.strategy==='ent'?.038:s.meta.strategy==='smb'?.030:.034)*diff.variance;
  const gmBase=clamp(f.grossMargin,.38,.90),baseBurn=Math.max(50000,avg(trailing(s,'burn',4).filter(x=>x>0))||f.burn||150000);
  const fixedBase=Math.max(0,f.cashExpenses-f.cogs-(f.oneOff||0)-(f.recruitingCost||0)-(f.principalPayment||0));
  const counts=getCustomerCounts(s),prepayMix=weightedAvg(Object.keys(SEGMENTS).map(k=>[s.plan.annualPrepay[k],counts[k]]));
  let seed=(s.rng^Math.imul(s.calendar.elapsed+1,2654435761)^0x9e3779b9)>>>0;
  const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  let spare=null;const z=()=>{if(spare!==null){const x=spare;spare=null;return x;}const u=Math.max(random(),1e-9),v=Math.max(random(),1e-9),r=Math.sqrt(-2*Math.log(u));spare=r*Math.sin(2*Math.PI*v);return r*Math.cos(2*Math.PI*v);};
  const endCash=[],endArr=[],runway=[],paths=[];let survived=0,distressed=0;
  for(let run=0;run<runs;run++){
    let cash=s.cash,mrr=m.mrr,gm=gmBase,macro=0,fixed=fixedBase,failed=false,hitDistress=false,lastBurn=baseBurn;
    for(let month=1;month<=months;month++){
      macro=macro*.58+z()*.014*diff.variance;
      let growth=baseGrowth+(baseGrowth-growthSafe(mrr,m.mrr,month))*.08+macro+z()*growthVol;
      if(random()<.055)growth+=random()<.54?randLocal(random,.025,.09):-randLocal(random,.035,.11);
      growth=clamp(growth,-.22,.30);mrr=Math.max(0,mrr*(1+growth));
      gm=clamp(gm+(gmBase-gm)*.16+z()*.012*diff.variance,.34,.91);
      fixed*=1.003+Math.max(-.008,z()*.006);
      const recognizedRevenue=mrr*(1-growth*.45);
      const variableCost=recognizedRevenue*(1-gm);
      let collectionRatio=.955+prepayMix*.075+z()*.035;
      if(random()<.10)collectionRatio+=prepayMix*randLocal(random,.12,.42);
      collectionRatio=clamp(collectionRatio,.72,1.42);
      const incidentCost=random()<(.055*diff.incident)?fixed*randLocal(random,.18,.72):0;
      const cashFlow=recognizedRevenue*collectionRatio-variableCost-fixed-incidentCost;
      cash+=cashFlow;lastBurn=Math.max(0,-cashFlow);

      if(cash<0){failed=true;break;}
    }
    if(!failed)survived++;if(hitDistress)distressed++;
    endCash.push(cash);endArr.push(mrr*12);runway.push(cash/Math.max(1,lastBurn||baseBurn));
    if(run<24)paths.push({cash,arr:mrr*12,failed});
  }
  return {runs,months,survival:survived/runs,distress:distressed/runs,
    cash:{p10:percentile(endCash,.10),p50:percentile(endCash,.50),p90:percentile(endCash,.90)},
    arr:{p10:percentile(endArr,.10),p50:percentile(endArr,.50),p90:percentile(endArr,.90)},
    runway:{p10:percentile(runway,.10),p50:percentile(runway,.50),p90:percentile(runway,.90)},baseGrowth,baseBurn,paths};
}
function growthSafe(current,start,month){return month>0?Math.pow(Math.max(.001,current/Math.max(1,start)),1/month)-1:0;}
function randLocal(random,min,max){return min+(max-min)*random();}

function renderFinance(){
  const f=financeView(state),m=getMetrics(state),pay=f.payroll||payrollBreakdown(state);const startCash=state.lastReport?.start.cash??state.cash-f.netCashFlow;
  const pnlRows=[
    ['Subscription revenue',f.subscriptionRevenue??f.revenue,''],['Services / consulting revenue',f.servicesRevenue||0,''],['Total revenue',f.revenue,'total'],
    ['Infrastructure & hosting',-f.infra,''],['Payment processing',-(f.processorFees||0),''],['Customer Success payroll',-pay.cogs,''],['Implementation / onboarding',-f.implementation,''],
    ['Gross profit',f.grossProfit,'total'],['R&D payroll',-f.rd,''],['Sales & Marketing',-f.salesMarketing,''],['G&A + tools',-f.ga,''],['Contractors',-(f.contractorCost||0),''],['Founder draw / compensation',-(f.founderDraw||0),''],['Training',-f.training,''],['Research, tools, legal & network budgets',-(f.activityBudgetCost||0),''],['Strategic initiatives',-f.initiativeCost,''],['Reserve contribution',-(f.taxReserveContribution||0),''],['Recruiting & one-offs',-(f.recruitingCost+f.oneOff),''],['EBITDA',f.ebitda,'total']

      ${metricRows([

      ])}
      <div class="section-title">Cost mix</div>${scoreCards(costCards)}

  <div class="grid two" style="margin-top:12px">

      ['CAC payback',round(f.payback,1)+' tháng','Target phụ thuộc segment',f.payback<=12?'up':f.payback>18?'down':''],
      ['Rule of 40',round(f.rule40,1),'Annualized growth + EBITDA margin',f.rule40>=40?'up':f.rule40<0?'down':'']

function v6AttentionDiagnostics(s=state){

function v6UpdateHypothesis(problem,hypothesisId,delta){

function v6SpawnProblem(type,options={},s=state){
  const existing=v6OpenProblems(s).find(p=>p.type===type);if(existing){if(options.severity)existing.severity=Math.max(existing.severity,options.severity);return existing;}
  const cooldowns={payment_readiness:12,relationship_debt:6,custom_pilot:7,legal_unknowns:12,cash_crisis:5,commercial_conversion:7,launch_readiness:10,buyer_access:8},last=s.problemOps.lastResolvedDayByType?.[type],cooldown=options.cooldownDays??cooldowns[type]??4;
  if(!options.force&&Number.isFinite(last)&&v6Day(s)-last<cooldown)return null;
  const base=v6DefaultProblemData(type,s),hypotheses=v6ProblemHypotheses(type),rootPool=hypotheses.map(h=>h.id),root=options.rootCause||rootPool[Math.floor(rand(s)*rootPool.length)];
  const p={id:v6Id('problem',s),type,status:'open',openedDay:v6Day(s),deadlineDay:options.deadlineDay??base.deadline,severity:options.severity??base.severity,domain:base.domain,title:options.title||base.title,summary:options.summary||base.summary,symptoms:options.symptoms||base.symptoms,unknowns:options.unknowns||base.unknowns,hypotheses,workingHypothesis:null,rootCause:root,escalations:0,progress:0,stakeholderIds:options.stakeholderIds||[],history:[],resolution:null};
  s.problemOps.problems.unshift(p);if(s.problemOps.problems.length>90){const live=s.problemOps.problems.filter(x=>x.status==='open'),closed=s.problemOps.problems.filter(x=>x.status!=='open');s.problemOps.problems=[...live,...closed.slice(0,Math.max(0,90-live.length))];}v6Decision(`Vấn đề mới: ${p.title}`,p.summary,'problem',s);return p;
}

function v6ResolveProblem(problemId,resolution,detail='',s=state){
  const p=v6ProblemById(problemId,s);if(!p||p.status!=='open')return;p.status='resolved';p.resolvedDay=v6Day(s);p.resolution=resolution;p.history.push({day:v6Day(s),text:resolution});if(p.history.length>40)p.history=p.history.slice(-40);
  s.problemOps.lastResolvedDayByType=s.problemOps.lastResolvedDayByType||{};s.problemOps.lastResolvedDayByType[p.type]=v6Day(s);s.problemOps.completedProblems.unshift(p.id);if(s.problemOps.completedProblems.length>160)s.problemOps.completedProblems.length=160;v6Decision(`Đóng vấn đề: ${p.title}`,detail||resolution,'resolution',s);
}

function v6ResearchValidity(question,sample,method){
  const q={
    severity:{interview:.92,observation:.86,artifact:.70,proposal:.58,concierge:.88,survey:.62},
    workflow:{interview:.64,observation:1,artifact:.92,proposal:.45,concierge:.96,survey:.34},
    buyer:{interview:.86,observation:.50,artifact:.62,proposal:.92,concierge:.74,survey:.40},
    budget:{interview:.55,observation:.42,artifact:.58,proposal:1,concierge:.96,survey:.28},
    urgency:{interview:.82,observation:.72,artifact:.68,proposal:.88,concierge:.84,survey:.48},
    switching:{interview:.72,observation:.92,artifact:.95,proposal:.74,concierge:.90,survey:.42}
  }[question]?.[method]||.55;
  const fit={
    severity:{existing_users:.75,target_users:.92,buyers:.82,lost_prospects:.96,experts:.55,cold_targeted:.76},
    workflow:{existing_users:.82,target_users:1,buyers:.45,lost_prospects:.78,experts:.62,cold_targeted:.76},
    buyer:{existing_users:.50,target_users:.58,buyers:1,lost_prospects:.85,experts:.72,cold_targeted:.74},
    budget:{existing_users:.32,target_users:.42,buyers:1,lost_prospects:.88,experts:.58,cold_targeted:.68},
    urgency:{existing_users:.65,target_users:.76,buyers:.92,lost_prospects:1,experts:.58,cold_targeted:.72},
    switching:{existing_users:.72,target_users:.84,buyers:.65,lost_prospects:1,experts:.68,cold_targeted:.78}
  }[question]?.[sample]||.6;
  return clamp(q*fit,.18,1.05);
}

function v6ResearchOutcome(action,problem,quality,s=state){

  const burnoutDelta=delta*(loadStress*.22+averageIntensity/75+jobStress*.025)-(diag.ratio<.75?delta*.045:0);b.burnout=clamp(b.burnout+burnoutDelta);b.energy=clamp(b.energy-burnoutDelta*.55+delta*(diag.ratio<.7?.025:0));if(b.burnout>72)b.health=clamp(b.health-delta*(b.burnout-70)*.006);else b.health=clamp(b.health+delta*.012);
  state.problemOps.stakeholders.forEach(x=>{x.patience=clamp(x.patience-delta*.035);});
  const completionCandidates=actions.filter(x=>x.remainingWork<=.001),completionQualities=new Map(completionCandidates.map(a=>[a.id,v6ActionExecutionQuality(a,state,diag)]));const completed=[];for(const a of completionCandidates)completed.push(v6CompleteAction(a,state,completionQualities.get(a.id)));
  let monthClose=null;if(ops.dayInMonth>30){ops.dayInMonth=1;monthClose=v6CloseProblemMonth(state);}
  const escalated=[];for(const p of v6OpenProblems().filter(x=>x.deadlineDay<=v6Day())){const e=v6EscalateProblem(p);if(e)escalated.push(e);}
  const promises=v6ProcessPromises(state);v6RefreshProblemBoard(state);ops.lastAdvance={fromDay:day,toDay:v6Day(),delta,completed:completed.map(x=>x?.id),escalated:escalated.map(x=>x.problem.id),promises:promises.map(x=>x.id),monthClose:monthClose?.label||null,diag};
  if(state.cash<0){state.game.status='ended';state.game.reason='Mất khả năng thanh toán';}if(b.personalCash<-b.livingCost*.35){state.game.status='ended';state.game.reason='Founder hết personal runway và không thể tiếp tục';}
  saveGame();renderApp();v6OpenAdvanceReport({delta,completed,escalated,promises,monthClose,diag});if(state.game.status!=='active')setTimeout(openEndingModal,80);
}

function v6NextDecisionDays(s=state){
  const d=v6AttentionDiagnostics(s),day=v6Day(s),actions=v6ActiveActions(s),vals=[v6DaysUntilMonthClose(s)];if(actions.length)vals.push(Math.max(1,Math.ceil(Math.min(...actions.map(a=>a.remainingWork))/Math.max(.01,d.speed))));v6OpenProblems(s).forEach(p=>vals.push(Math.max(1,p.deadlineDay-day)));s.problemOps.promises.filter(x=>x.status==='open').forEach(p=>vals.push(Math.max(1,p.dueDay-day)));return Math.max(1,Math.min(...vals.filter(Number.isFinite)));
}

};
renderTab=function(){
  if(activeTab==='evidence')return renderEvidenceLab();if(activeTab==='delivery')return renderProductDelivery();if(activeTab==='relationships')return renderRelationships();if(activeTab==='ledger')return renderLedgerRisk();if(activeTab==='decisions')return renderDecisionSystem();if(activeTab==='advanced')return renderAdvancedModel();return renderSituationRoom();
};
renderApp=function(){
  if(!state){renderSetup();return;}v6EnsureProblemOps(state,false);v6RefreshProblemBoard(state);if(!TABS.some(x=>x[0]===activeTab))activeTab='situation';if(activeTab==='overview')activeTab='situation';document.getElementById('app').innerHTML=`${renderHeader()}${renderAlertStrip()}${renderKpis()}${renderNav()}<div class="tab-panel">${renderTab()}</div>${renderActionbar()}`;
};
refreshReadiness=function(){if(!state)return;const copy=document.getElementById('readinessCopy'),btn=document.getElementById('runMonthBtn'),d=v6AttentionDiagnostics(),days=v6NextDecisionDays();if(copy)copy.innerHTML=`<strong class="${d.ratio>1.15?'down':'up'}">${d.ratio>1.15?'Overcommitted':'Decision system active'}</strong><span>${v6ActiveActions().length} commitments · next decision ~${days}d.</span>`;if(btn){btn.disabled=state.game.status!=='active'||state.fundraising?.status==='term_sheet';btn.textContent=`Tới decision point tiếp theo · ~${days}d →`;}};

startCompany=function(){
  const name=(document.getElementById('companyName')?.value||setupSelection.companyName||'Tiny Orbit').trim();setupSelection.companyName=name;state=makeInitialState(setupSelection);activeTab='situation';saveGame();renderApp();toast('Startup đã khởi tạo. Situation Room có các vấn đề đầu tiên.','good');
};
importGame=function(file){
  if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed.meta||!parsed.history||!parsed.bootstrap)throw new Error('incompatible_zero_to_one_save');state=migrateState(parsed)||parsed;state.version=APP_VERSION;activeTab='situation';saveGame();renderApp();toast('Đã nhập save và migrate sang problem-first model.','good');}catch(e){console.error(e);toast(e?.message==='incompatible_zero_to_one_save'?'Save này không thuộc zero-to-one $500 simulator.':'File save không hợp lệ.','bad');}};reader.readAsText(file);
};
resetGame=function(){if(!confirm('Xóa toàn bộ trạng thái hiện tại và bắt đầu lại?'))return;try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(UNDO_KEY);}catch(e){}state=null;activeTab='situation';renderApp();};


const importInput=document.getElementById('importFile');
importInput.addEventListener('change',e=>{importGame(e.target.files?.[0]);e.target.value='';});
state=loadGame();
renderApp();
if(state?.pendingEvent)setTimeout(openPendingEvent,120);
if(state&&state.game.status!=='active')setTimeout(openEndingModal,120);
</script>
</body>
</html>
